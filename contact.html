<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Sri Sathyasai Gurukulam</title>
    <link
      rel="icon"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <!-- tailwindcss -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <div id="header"></div>
    <main class="w-full">
      <!-- ================= HERO ================= -->
      <section class="relative h-[350px] flex items-center justify-center">
        <img
          src="assets/images/contact-banner.jpg"
          class="absolute inset-0 w-full h-full object-cover"
        />

        <div class="absolute inset-0 bg-[#273C8F]/75"></div>

        <div class="relative text-center text-white">
          <h1 class="text-5xl font-bold">Contact Us</h1>
          <p class="mt-4 text-lg">We'd Love to Hear From You</p>
        </div>
      </section>

      <!-- ================= CONTACT ================= -->

      <section class="py-20 bg-gray-100">
        <div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-10">
          <!-- Contact Details -->

          <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-3xl font-bold text-[#273C8F] mb-8">Get In Touch</h2>

            <div class="space-y-6">
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"
                >
                  <i class="fa-solid fa-location-dot text-[#273C8F]"></i>
                </div>

                <div>
                  <h4 class="font-semibold">Address</h4>

                  <p class="text-gray-600">
                    Chitrada, Morada, Mayurbhanj, Odisha – 757018
                  </p>
                </div>
              </div>

              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"
                >
                  <i class="fa-solid fa-phone text-[#273C8F]"></i>
                </div>

                <div>
                  <h4 class="font-semibold">Phone</h4>

                  <p class="text-gray-600">+91 9439380922</p>
                </div>
              </div>

              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"
                >
                  <i class="fa-solid fa-envelope text-[#273C8F]"></i>
                </div>

                <div>
                  <h4 class="font-semibold">Email</h4>

                  <p class="text-gray-600">srisathyasaigurukulamchitroda@gmail.com</p>
                </div>
              </div>

              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center"
                >
                  <i class="fa-solid fa-clock text-[#273C8F]"></i>
                </div>

                <div>
                  <h4 class="font-semibold">Office Hours</h4>

                  <p class="text-gray-600">
                    Monday – Saturday : 8:00 AM – 4:00 PM
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Contact Form -->

          <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-3xl font-bold text-[#273C8F] mb-8">Send Message</h2>

            <form class="space-y-5">
              <input
                type="text"
                placeholder="Full Name"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#273C8F]"
              />

              <input
                type="email"
                placeholder="Email Address"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#273C8F]"
              />

              <input
                type="tel"
                placeholder="Mobile Number"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#273C8F]"
              />

              <textarea
                rows="5"
                placeholder="Your Message"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#273C8F]"
              ></textarea>

              <button
                class="w-full bg-[#273C8F] text-white py-3 rounded-lg hover:bg-blue-900 transition"
              >
                Send Message
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- ================= MAP ================= -->

      <section>
        <iframe
          src="YOUR_GOOGLE_MAP_URL"
          class="w-full h-[400px]"
          loading="lazy"
        >
        </iframe>
      </section>
    </main>
    <!-- footer -->
    <div id="footer"></div>

    <script src="js/main.js"></script>
  </body>
</html>
